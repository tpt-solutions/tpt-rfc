[package]
name = "tpt-dtls"
version.workspace = true
edition.workspace = true
# `orion` (X25519) and `ed25519-compact` pull in a newer MSRV than the
# workspace-wide 1.74 baseline; this crate follows its crypto primitives.
rust-version = "1.86"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["dtls", "rfc9147", "tls13", "udp", "security"]
categories = ["network-programming", "cryptography"]
description = "Clean-room, dual-licensed DTLS 1.3 (RFC 9147) implementation with connection-ID (RFC 9146) support"
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# All cryptographic primitives are dual-licensed (MIT/Apache-2.0 or MIT) and
# reused rather than reimplemented, consistent with the platform's clean-room
# policy:
#   sha2              — transcript hashes (SHA-256/384)      MIT/Apache-2.0
#   hkdf / hmac       — TLS 1.3 key schedule (HKDF)          MIT/Apache-2.0
#   subtle            — constant-time comparisons            BSD-2/ISC (permissive)
#   orion             — X25519 ECDH (MIT)                    MIT
#   ed25519-compact   — Ed25519 CertificateVerify (MIT)      MIT
#   aes-gcm           — AES-GCM AEAD (TLS_AES_128/256_GCM)   MIT/Apache-2.0
#   chacha20poly1305  — CHACHA20_POLY1305 AEAD               MIT/Apache-2.0
sha2 = "0.10"
hmac = "0.12"
subtle = "2"
orion = "0.17"
ed25519-compact = { version = "2", features = ["getrandom"] }
getrandom = "0.2"
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
aead = "0.5"

[dev-dependencies]
hex = "0.4"
hkdf = "0.12"

[package.metadata.docs.rs]
all-features = true
