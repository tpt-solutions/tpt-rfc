[package]
name = "tpt-x509"
version.workspace = true
edition.workspace = true
rust-version = "1.74"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["x509", "rfc5280", "certificate", "pkix", "path-validation"]
categories = ["cryptography"]
description = "Clean-room, dual-licensed X.509 certificate path validation (RFC 5280)"
readme = "README.md"

[dependencies]
thiserror = { workspace = true }
# Dual-licensed (MIT/Apache-2.0) X.509 parser from RustCrypto. We reuse it for
# DER decoding only and build clean-room *validation* logic on top (the gap
# rustls-webpki leaves, while keeping a permissive license).
x509-cert = { version = "0.3", features = ["builder"] }
# ASN.1 DER helpers (RustCrypto, MIT/Apache-2.0). x509-cert 0.3 itself depends
# on der/spki/const-oid 0.8/0.8/0.10, so we pin to the SAME versions to keep
# the `der`/`spki` trait impls (Decode, Sequence, …) unambiguous. `der`'s
# `derive` feature is required for the hand-rolled RSA public-key struct.
spki = "0.8"
der = { version = "0.8", features = ["derive"] }
const-oid = "0.10"
# Crypto primitives for signature verification (all dual-licensed):
# `sha2` is pinned to 0.11 to match `x509-cert` and must carry the `oid`
# feature so ECDSA test-cert generation (via the `x509_cert` builder) can map
# the P-256 hash to its `AssociatedOid`.
sha2 = { version = "0.11", features = ["oid"] } # MIT/Apache-2.0
# `spki` feature required so `ecdsa::Signature` implements `SignatureBitStringEncoding`
# (needed by the `x509_cert` builder when minting ECDSA test certificates).
ecdsa = { version = "0.17", features = ["spki", "alloc", "der"] } # MIT/Apache-2.0
p256 = "0.14"          # MIT/Apache-2.0
p384 = "0.14"          # MIT/Apache-2.0
ed25519-compact = "2"  # MIT
# Arbitrary-precision integer backend (dual MIT/Apache-2.0) used solely for RSA
# modular exponentiation in `verify`. The PKCS#1 v1.5 EMSA logic is our own;
# `num-bigint` provides only the big-integer arithmetic (no RSA implementation).
num-bigint = "0.4"      # MIT/Apache-2.0

[dev-dependencies]
hex = "0.4"
flagset = "0.4"
signature = "3"
regex = "1"

[package.metadata.docs.rs]
all-features = true

