[package]
name = "tpt-cms"
version.workspace = true
edition.workspace = true
rust-version = "1.74"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["cms", "rfc5652", "pkcs7", "cryptographic-message-syntax", "pkix"]
categories = ["cryptography"]
description = "Clean-room, dual-licensed Cryptographic Message Syntax (CMS, RFC 5652) — SignedData, EnvelopedData, DigestedData, EncryptedData"
readme = "README.md"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# ASN.1 DER + X.509 primitives (RustCrypto, MIT/Apache-2.0). Pinned to the same
# `der`/`spki`/`const-oid` 0.8/0.8/0.10 line already used by `tpt-x509`/`tpt-tsp`
# so the `Decode`/`Sequence`/`AlgorithmIdentifierRef` types line up across the
# workspace. CMS wire structures are hand-rolled on top (clean room).
der = { version = "0.8", features = ["derive"] }
spki = "0.8"
const-oid = "0.10"
x509-cert = { version = "0.3", features = ["builder"] }
# Cryptographic primitives for signing/verifying (all dual-licensed).
sha2 = { version = "0.11", features = ["oid"] } # MIT/Apache-2.0
ecdsa = { version = "0.17", features = ["spki", "alloc"] } # MIT/Apache-2.0
p256 = { version = "0.14", features = ["ecdh"] }          # MIT/Apache-2.0
p384 = { version = "0.14", features = ["ecdh"] }          # MIT/Apache-2.0
rsa = "0.9"            # MIT/Apache-2.0
ed25519-compact = "2"  # MIT
# Content encryption / key wrapping (all dual-licensed RustCrypto / ISC-ish).
aes = "0.8"            # MIT/Apache-2.0
cbc = { version = "0.1", features = ["alloc"] } # MIT/Apache-2.0
block-padding = "0.3" # MIT/Apache-2.0
digest = "0.10"        # MIT/Apache-2.0
cipher = "0.4"        # MIT/Apache-2.0
rand_core = { version = "0.6", features = ["getrandom"] } # MIT/Apache-2.0 (CEK generation)

[dev-dependencies]
hex = "0.4"
flagset = "0.4"

[package.metadata.docs.rs]
all-features = true
