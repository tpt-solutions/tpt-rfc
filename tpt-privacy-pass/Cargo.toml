[package]
name = "tpt-privacy-pass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["privacy-pass", "rfc9576", "rfc9497", "oprf", "voprf", "poprf", "anonymous-tokens"]
categories = ["cryptography"]
description = "Clean-room, dual-licensed (MIT OR Apache-2.0) RFC 9576 Privacy Pass — OPRF/VOPRF/POPRF (RFC 9497) token issuance and redemption"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# All cryptographic primitives are dual-licensed (MIT/Apache-2.0) and reused
# rather than reimplemented. This crate deliberately does NOT take a direct
# `elliptic-curve` dependency: `p256`/`p384` 0.14 are built on the
# `elliptic-curve` 0.13.34 generation, and every `elliptic_curve::{…}` path in
# this crate is reached via `p256::elliptic_curve` (the same locked, cached
# 0.13.34 instance `p256`/`p384` use). That keeps the whole crate on a single
# `elliptic-curve` copy — a direct `elliptic-curve` dependency would either
# re-resolve to a different 0.13.y (or fail, since the 0.13.x line has since
# been pulled from crates.io) or to 0.14.x, both of which disagree with
# `p256`'s `Curve` and trigger type-mismatch errors.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "alloc"] } # MIT/Apache-2.0
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "alloc"] } # MIT/Apache-2.0
generic-array = "0.14" # MIT/Apache-2.0 — `ArrayLength` bound used on the `Suite` trait
sha2 = "0.10"       # MIT/Apache-2.0 — hashing (Sha256/Sha384)
digest = "0.10"     # MIT/Apache-2.0 — hashing traits used by the above
getrandom = { version = "0.2", features = ["std"] } # MIT/Apache-2.0 — CSPRNG for blind/key generation
thiserror = { workspace = true }
typenum = "1"     # MIT/Apache-2.0 — type-level arithmetic used in the `Suite` trait bounds

[dev-dependencies]
hex = "0.4" # MIT/Apache-2.0

[package.metadata.docs.rs]
all-features = true
