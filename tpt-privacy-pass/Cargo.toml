[package]
name = "tpt-privacy-pass"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["privacy-pass", "rfc9576", "rfc9497", "oprf", "voprf", "poprf", "anonymous-tokens"]
categories = ["cryptography"]
description = "Clean-room, dual-licensed (MIT OR Apache-2.0) RFC 9576 Privacy Pass — OPRF/VOPRF/POPRF (RFC 9497) token issuance and redemption"
readme = "README.md"

[lints]
workspace = true

[dependencies]
# All cryptographic primitives are dual-licensed (MIT/Apache-2.0) and reused
# rather than reimplemented. `p256`/`p384` 0.14 are built on the
# `elliptic-curve` 0.13 generation (generic-array 0.14, no `hybrid-array`), so
# this crate pins the SAME generation for `elliptic-curve`/`hash2curve` to keep
# the `Curve`/`FieldBytesSize` types aligned across `p256` and the generic
# `elliptic_curve::{Scalar, FieldBytes, …}` paths used here.
p256 = { version = "0.14", default-features = false, features = ["arithmetic", "alloc"] } # MIT/Apache-2.0
p384 = { version = "0.14", default-features = false, features = ["arithmetic", "alloc"] } # MIT/Apache-2.0
# Pin the EXACT `elliptic-curve` version `p256`/`p384` 0.14 resolve to
# (`0.13.34`, cached in the workspace lock), so the `Curve` /
# `CurveArithmetic` / `PrimeCurve` traits line up across `p256` and this
# crate's generic `elliptic_curve::{Scalar, FieldBytes, …}` paths. A looser
# `^0.13` would re-resolve to a different 0.13.y minor (or, since the 0.13.x
# line has since been pulled from crates.io, fail to resolve at all), causing
# two copies of `elliptic-curve` in the graph and type-mismatch errors.
elliptic-curve = { version = "=0.13.34", default-features = false, features = ["arithmetic", "alloc", "ff", "group", "sec1"] } # MIT/Apache-2.0
generic-array = "0.14" # MIT/Apache-2.0 — `ArrayLength` bound used on the `Suite` trait
sha2 = "0.10"       # MIT/Apache-2.0 — hashing (Sha256/Sha384)
digest = "0.10"     # MIT/Apache-2.0 — hashing traits used by the above
getrandom = { version = "0.2", features = ["std"] } # MIT/Apache-2.0 — CSPRNG for blind/key generation
thiserror = { workspace = true }
typenum = "1"     # MIT/Apache-2.0 — type-level arithmetic used in the `Suite` trait bounds

[dev-dependencies]
hex = "0.4" # MIT/Apache-2.0

[package.metadata.docs.rs]
all-features = true
