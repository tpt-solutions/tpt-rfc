[workspace]
resolver = "2"
members = [
    "tpt-cbor",
    "tpt-hotp",
    "tpt-doh",
    "tpt-ssh",
    "tpt-x509",
    "tpt-http-cache",
    "tpt-http-sig",
    "tpt-ed25519",
    "tpt-privacy-pass",
    "tpt-cms",
    "tpt-dhcpv6",
    "tpt-ospf",
    "tpt-imap-server",
    "tpt-pop3",
    "tpt-bfd",
    "tpt-snmp",
    "tpt-smtp",
    "tpt-netconf",
    "tpt-sieve",
    "tpt-dtls",
    "tpt-rtp",
    "tpt-ocsp",
    "tpt-bgp",
    "tpt-radius",
    "tpt-ipsec",
    "tpt-jmap",
    "tpt-tsp",
    "tpt-kerberos",
]

# `tpt-x25519` opts out of the parent workspace (it declares its own
# `[workspace]`) so that it builds and tests independently. Exclude it
# explicitly to avoid a "multiple workspace roots" conflict.
exclude = ["tpt-x25519", "tpt-ldap-server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions <oss@tpt.example>"]
repository = "https://github.com/tpt-solutions/tpt-rfc"
homepage = "https://github.com/tpt-solutions/tpt-rfc"
keywords = ["rfc", "protocol", "ietf"]
categories = ["encoding", "network-programming", "cryptography"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# Shared lints applied to all workspace members.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# `tpt-x509`'s RSA signature verification performs modular exponentiation; build
# it optimized even in dev/test profiles so the PKITS conformance harness runs
# in reasonable time (the crate's dependencies stay at the dev opt-level).
[profile.dev.package.tpt-x509]
opt-level = 3
