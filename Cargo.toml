[workspace]
resolver = "2"
members = [
    "tpt-http-sig",
    "tpt-cbor",
    "tpt-hotp",
    "tpt-ssh",
    "tpt-x509",
    "tpt-imap-server",
    "tpt-cms",
]

# `tpt-x25519` opts out of the parent workspace (it declares its own
# `[workspace]`) so that it builds and tests independently. Exclude it
# explicitly to avoid a "multiple workspace roots" conflict.
exclude = ["tpt-x25519"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions <oss@tpt.example>"]
repository = "https://github.com/tpt-solutions/tpt-rfc"
homepage = "https://github.com/tpt-solutions/tpt-rfc"
keywords = ["rfc", "protocol", "ietf"]
categories = ["encoding", "network-programming", "cryptography"]
readme = "README.md"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "1"

# Shared lints applied to all workspace members.
[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

