[package]
name = "tpt-tsp"
version.workspace = true
edition.workspace = true
rust-version = "1.74"
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["tsp", "rfc3161", "timestamp", "pkix", "cms"]
categories = ["cryptography", "network-programming"]
description = "Clean-room, dual-licensed RFC 3161 Time-Stamp Protocol (TSP) — TimeStampReq/TimeStampResp client, verification, and a minimal TSA responder"
readme = "README.md"

[lints]
workspace = true

[dependencies]
thiserror = { workspace = true }
# ASN.1 DER + X.509 primitives (RustCrypto, MIT/Apache-2.0). Pin the SAME
# `der`/`spki`/`const-oid`/`x509-cert` versions used by `tpt-cms` so the
# TSTInfo-bearing CMS SignedData and the `x509-cert` types line up.
der = { version = "0.8", features = ["derive"] }
spki = "0.8"
const-oid = "0.10"
x509-cert = { version = "0.3", features = ["builder"] }
# Cryptographic primitives for signing/verifying (all dual-licensed).
sha2 = { version = "0.11", features = ["oid"] } # MIT/Apache-2.0
sha2_010 = { package = "sha2", version = "0.10", features = ["oid"] } # for rsa Pkcs1v15Sign generic
ecdsa = { version = "0.17", features = ["spki", "alloc"] } # MIT/Apache-2.0
p256 = { version = "0.14", features = ["ecdh"] } # MIT/Apache-2.0
p384 = { version = "0.14", features = ["ecdh"] } # MIT/Apache-2.0
rsa = "0.9" # MIT/Apache-2.0
ed25519-compact = { version = "2", features = ["random"] } # MIT
sha1 = "0.10" # MIT/Apache-2.0 (deprecated SHA-1 option, for interop only)
rand_core = { version = "0.6", features = ["getrandom"] } # MIT/Apache-2.0 (nonce/serial)

[dev-dependencies]
hex = "0.4"
sha2 = { version = "0.11", features = ["oid"] }
sha2_010 = { package = "sha2", version = "0.10", features = ["oid"] }

[package.metadata.docs.rs]
all-features = true
