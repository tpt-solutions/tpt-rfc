[package]
name = "tpt-tsp"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT OR Apache-2.0"
authors = ["TPT Solutions <oss@tpt.example>"]
repository = "https://github.com/tpt-solutions/tpt-rfc"
homepage = "https://github.com/tpt-solutions/tpt-rfc"
keywords = ["rfc3161", "timestamp", "tsp", "timestamping", "pkix"]
categories = ["cryptography"]
description = "Clean-room, dual-licensed RFC 3161 Time-Stamp Protocol (TSP) — client request/verification and TSA responder"
readme = "README.md"

# Self-contained workspace so the crate builds and tests independently of the
# platform root manifest (which is regenerated separately). When folded into the
# platform workspace, switch these back to `*.workspace = true`.
[workspace]

[lints]
rust.unsafe_code = "warn"
clippy.all = "warn"

[dependencies]
thiserror = "1"
# ASN.1 DER + CMS helpers (RustCrypto, MIT/Apache-2.0). Pinned to the
# `der`/`spki`/`const-oid` 0.7 line that `x509-cert` 0.3 (builder API) and
# `rsa` 0.9 / `ecdsa` 0.17 are built against, so the whole crate shares a
# single, coherent `der`/`spki`/`const-oid` version. The 0.8 line splits
# `OctetStringRef`/`ObjectIdentifierRef` to zero-lifetime types and removes
# `AnyRef::as_bytes`, which is incompatible with this crate's 0.7-era code.
der = { version = "0.7", features = ["derive"] }
spki = "0.7"
const-oid = "0.9"
x509-cert = { version = "0.3", features = ["builder"] }
# Cryptographic primitives for signing/verifying timestamps (all dual-licensed).
sha2 = { version = "0.10", features = ["oid"] } # MIT/Apache-2.0
rsa = "0.9"            # MIT/Apache-2.0
ecdsa = { version = "0.16", features = ["spki"] } # MIT/Apache-2.0
p256 = "0.13"          # MIT/Apache-2.0
p384 = "0.13"          # MIT/Apache-2.0
ed25519-compact = "2"  # MIT

[dev-dependencies]
hex = "0.4"
rand_core = "0.6" # MIT/Apache-2.0 (test key generation)

[package.metadata.docs.rs]
all-features = true
